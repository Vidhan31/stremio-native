[workspace]
resolver = "2"
members = [
    "app",
    "credential-store",
    "debrid",
    "media-integrations",
    "core-env",
    "playback-mpv",
    "server-connector",
    "stream-ranking",
]
exclude = ["vendor/i-slint-renderer-skia"]

[workspace.dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
blake3 = "1.8.7"
chrono = "0.4.45"
chacha20poly1305 = "0.11.0"
crash-handler = "0.8.1"
dirs = "7.0.0"
futures = "0.3.34"
fluent-bundle = "0.16.0"
glow = "0.18.0"
http = "1.5.0"
image = { version = "0.25.10", default-features = false }
moka = "0.12.16"
notify = "8.2.2"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false }
rand = "0.10.2"
serde = "1.0.229"
serde_json = "1.0.154"
self_update = { version = "1.3.3", default-features = false, features = ["reqwest", "rustls", "archive-zip", "compression-zip-deflate", "github"] }
zip = { version = "9.7.3", default-features = false, features = ["deflate"] }
slint = { version = "=1.19.0", default-features = false }
# Keep the compiler aligned with the runtime and local renderer patch.
slint-build = "=1.19.0"
stremio-core = { git = "https://github.com/Vidhan31/stremio-core.git", rev = "7fb155ff838f1425d75b136c2373b6f70af3f108", features = ["derive", "analytics", "env-future-send"] }
stream-server = { git = "https://github.com/Vidhan31/stream-server.git", rev = "4bdf3de220f56f0a2d6d1442df73ab0ff364f348", package = "server", default-features = false, features = ["libtorrent"] }
sys-locale = "0.3.2"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-util = "0.7.20"
tower = "0.5.3"
tracing = { version = "0.1.44", features = ["release_max_level_info"] }
tracing-appender = "0.2.5"
tracing-chrome = "0.7.2"
tracing-subscriber = "0.3.23"
url = "2.5.8"
unic-langid = "0.9.6"
walkdir = "2.5.0"
discord-rich-presence = "1.1.0"
# Pure-Rust zbus backend so Linux builds need no system libdbus. The Windows
# (SMTC) and macOS (MediaRemote) backends ignore this feature.
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }
keepawake = "0.6.1"
keyring = { version = "4.2.0", default-features = false, features = ["v1", "zbus-secret-service-keyring-store"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "mp3"] }
mlua = { version = "0.12.2", features = ["lua54", "vendored", "serialize"] }
minidumper = "0.11.0"
turso = { version = "0.8.3", default-features = false }

[patch.crates-io]
# Slint's unversioned OpenGL request maps to exactly 3.3 in glutin. Try newer
# desktop contexts first so drivers can use their highest supported version.
i-slint-renderer-skia = { path = "vendor/i-slint-renderer-skia" }

[profile.release]
opt-level = 3
# ThinLTO instead of `true` (fat). Fat LTO merges the whole program into one
# module and optimizes it on a single thread, which is the dominant cost of a
# release build here. ThinLTO keeps cross-crate inlining through summaries and
# runs in parallel. `codegen-units = 1` existed to compensate for the lack of
# cross-unit optimization; ThinLTO restores that across units, so the serial
# codegen bottleneck is no longer buying anything.
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

# Build scripts, proc macros and their dependencies never ship in the binary,
# so optimizing them cannot affect the app's runtime. They are not left at
# opt-level 0 either: this tree runs real work at build time -- the Slint
# compiler over ui/app.slint and the cxx bridge -- and an unoptimized compiler
# is slow enough to cost more than the build saves. opt-level 1 is the point
# where that work is close to full speed while compiling far faster than 3.
[profile.release.build-override]
opt-level = 1

[profile.dev]
opt-level = 0
# Keep file/line information for backtraces and crash reports without emitting
# full variable/type debug data for every workspace crate.
debug = "line-tables-only"
incremental = true
split-debuginfo = "unpacked"

# Dependencies dominate this workspace's debug artifact size. Their symbols
# remain available through the opt-in `debugging` profile below when needed.
[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
opt-level = 1

# Use `cargo build --profile debugging` when a full source-level debugging
# session is more important than build time and disk usage.
[profile.debugging]
inherits = "dev"
debug = "full"
