[package]
name = "async-rar"
version = "0.1.8"
edition = "2024"
rust-version.workspace = true
description = "Async Rust bindings for UnRAR"
license = "MIT"
repository = "https://github.com/user/async-rar"
keywords = ["rar", "unrar", "archive", "async", "ffi"]
categories = ["compression", "asynchronous"]

[dependencies]
autocxx = "0.31"
cxx = "1.0"
tokio = { workspace = true, features = ["rt", "sync"] }
thiserror = { workspace = true }

[build-dependencies]
autocxx-build = "0.31"
cc = "1.2"
glob = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }


