[stremio-dev]
image=registry.fedoraproject.org/fedora:44
pull=true
replace=true
additional_packages="autoconf automake clang clang-devel cmake curl diffutils gcc gcc-c++ git libxkbcommon-devel mpv-devel mesa-libEGL-devel mesa-libGL-devel ninja-build openssl-devel pkgconf-pkg-config python3 shadow-utils sudo tar unzip zip fontconfig-devel freetype-devel wayland-devel kernel-headers perl-IPC-Cmd perl-FindBin perl-Time-Piece which"
init_hooks="sh -c 'for d in \"${PWD}\" \"${HOME}/Projects/stremio-native\" \"${HOME}/stremio-native\"; do if [ -f \"$d/scripts/init-devbox.sh\" ]; then exec \"$d/scripts/init-devbox.sh\"; fi; done'"
