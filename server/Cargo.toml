[package]
name = "server"
version = "0.1.8"
edition = "2024"
rust-version.workspace = true
license = "MIT"
description = "High-performance torrent streaming server"
authors = ["Perpetus <perpetus@example.com>"]

[lib]
name = "stream_server"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
enginefs = { path = "../enginefs", default-features = false }
axum = "0.8.9"
tokio = { workspace = true, features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "fs", "limit"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2.4"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio-util = { workspace = true, features = ["io", "compat"] }
hex = "0.4"
if-addrs = "0.15.0"
urlencoding = "2.1"
regex = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
futures-util = { workspace = true }
async-trait = "0.1.92"
async_zip = { version = "0.0.19", features = ["deflate", "tokio"] }
base64 = "0.23.1"
walkdir = "2.5.0"
url = { workspace = true }
mime_guess = "2.0.5"
async-rar = { path = "../bindings/async-rar" }
lz-str = "0.2.1"
tempfile = "3.23.0"
sha2 = "0.11.0"
semver = "1.0"
notify = { version = "8.2.2", default-features = false, features = [
    "macos_kqueue",
] }

dirs = "7.0.0"
dashmap = "6.1.0"
tar = "0.4.44"
flate2 = "1.1.5"
uuid = { workspace = true }
bytes = { workspace = true }
axum-server = { version = "0.9.2", features = ["tls-rustls"] }
ssdp-client = "2.1.0"
fslock = "0.2.1"
zip = "9.7.3"
async-sevenz = { path = "../bindings/async-sevenz" }
chrono = "0.4.42"
sysinfo = "0.40.4"
mimalloc = { version = "0.1", optional = true, default-features = false, features = ["no_thp"] }

[target.'cfg(target_os = "android")'.dependencies]
rustls-platform-verifier = "0.7.0"
jni = "0.22.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }


[features]
default = ["libtorrent", "mimalloc"]
libtorrent = ["enginefs/libtorrent"]
mimalloc = ["dep:mimalloc"]

[package.metadata.deb]
maintainer = "stream-server maintainers"
copyright = "2025"
license-file = ["../LICENSE", "0"]
extended-description = "High-performance torrent streaming server with HLS transcoding support"
section = "net"
priority = "optional"
assets = [
    ["target/release/server", "usr/bin/stream-server", "755"],
]

[package.metadata.wix]
upgrade-guid = "A1B2C3D4-E5F6-7890-ABCD-EF1234567890"
path-guid = "B2C3D4E5-F678-90AB-CDEF-123456789012"
license = false
eula = false

[build-dependencies]
winres = "0.1"
chrono = "0.4.42"

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["blocking", "json"] }


